apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-config
  namespace: task-app
data:
  default.conf: |
    server {
        listen 80;

        location /app/ {
            proxy_pass http://frontend:80/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /api/ {
            proxy_pass http://backend:5000/api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location / {
            return 404;
        }
    }